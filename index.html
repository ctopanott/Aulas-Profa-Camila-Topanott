<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aulas da Profa. Camila</title>
<meta name="description" content="Slides e materiais das aulas da Profa. Camila, separados por turma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: uma coluna estreita; cabeçalho com o nome, seletor de turmas, lista numerada de aulas, área da professora no fim */
:root{
  --papel:#F7F4EF; --superficie:#FFFFFF; --tinta:#2F3A45; --suave:#64707B; --linha:#E4DED5;
  --cobre:#9A5A36; --cobre-fundo:#F7E2D3; --tinta-forte:#26313B; --sobre-cobre:#FFFFFF;
  --ok:#3F6B4F; --alerta:#9A3B1C;
  --botao-fundo:#F6D9C6; --botao-texto:#5A3422; --botao-borda:#EBC2A7;
  --botao2-fundo:#E2ECF7; --botao2-texto:#24405F; --botao2-borda:#BCD2EA;
  --chip-fundo:#FFFFFF; --chip-texto:#2F3A45; --chip-borda:#E4DED5;
  --chip-ativo-fundo:#D4E5F5; --chip-ativo-texto:#1E3A5A; --chip-ativo-borda:#9FC0E2;
  --tag-fundo:#E1EEDB; --tag-texto:#3D5F2E;
  --f-titulo:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-texto:"Barlow",Arial,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#22272C; --superficie:#2B3137; --tinta:#E8E5E0; --suave:#B4BAC0; --linha:#3D444B;
  --cobre:#E8B595; --cobre-fundo:#4A382D; --tinta-forte:#F3F0EB; --sobre-cobre:#2A1A10;
  --ok:#9CCFAE; --alerta:#F0A982;
  --botao-fundo:#5C4535; --botao-texto:#F8E6D9; --botao-borda:#76594A;
  --botao2-fundo:#344A61; --botao2-texto:#E3EEF9; --botao2-borda:#4B6684;
  --chip-fundo:#2B3137; --chip-texto:#E8E5E0; --chip-borda:#3D444B;
  --chip-ativo-fundo:#3E5875; --chip-ativo-texto:#EAF2FB; --chip-ativo-borda:#5C7C9E;
  --tag-fundo:#36492F; --tag-texto:#D3EBC6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#22272C; --superficie:#2B3137; --tinta:#E8E5E0; --suave:#B4BAC0; --linha:#3D444B;
  --cobre:#E8B595; --cobre-fundo:#4A382D; --tinta-forte:#F3F0EB; --sobre-cobre:#2A1A10;
  --ok:#9CCFAE; --alerta:#F0A982;
  --botao-fundo:#5C4535; --botao-texto:#F8E6D9; --botao-borda:#76594A;
  --botao2-fundo:#344A61; --botao2-texto:#E3EEF9; --botao2-borda:#4B6684;
  --chip-fundo:#2B3137; --chip-texto:#E8E5E0; --chip-borda:#3D444B;
  --chip-ativo-fundo:#3E5875; --chip-ativo-texto:#EAF2FB; --chip-ativo-borda:#5C7C9E;
  --tag-fundo:#36492F; --tag-texto:#D3EBC6; color-scheme:dark;
}
body{background:var(--papel);color:var(--tinta);font:17px/1.55 var(--f-texto);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#raiz{max-width:860px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--cobre)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobre);outline-offset:2px;border-radius:6px}

.topo{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--linha);padding-bottom:24px}
.rotulo{font:500 13px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cobre)}
.topo h1{font:700 clamp(40px,8vw,64px)/1 var(--f-titulo);color:var(--tinta-forte);letter-spacing:.005em}
.topo .intro{color:var(--suave);max-width:60ch}

.turmas{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;border:1.5px solid var(--chip-borda);background:var(--chip-fundo);color:var(--chip-texto);text-decoration:none;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--chip-ativo-borda);background:var(--botao2-fundo)}
.chip.ativo{background:var(--chip-ativo-fundo);border-color:var(--chip-ativo-borda);color:var(--chip-ativo-texto);font-weight:600}
.chip.novo{border-style:dashed;color:var(--cobre)}

.turma{display:flex;flex-direction:column;gap:20px}
.turma-cab{display:flex;flex-direction:column;gap:4px}
.turma-cab h2{font:700 36px/1.05 var(--f-titulo);color:var(--tinta-forte)}
.turma-cab .uc{color:var(--suave)}

.aulas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--linha)}
.aula{display:grid;grid-template-columns:96px 1fr auto;gap:8px 20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--linha)}
.num{font:500 13px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.aula-texto{min-width:0;display:flex;flex-direction:column;gap:2px}
.aula-texto h3{font:600 20px/1.25 var(--f-texto)}
.aula-texto p{color:var(--suave);font-size:16px}
.aula-texto .data{font:500 13px/1.3 var(--f-mono);color:var(--suave)}
.novidade{display:inline-block;margin-left:8px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tag-texto);background:var(--tag-fundo);padding:4px 7px;border-radius:4px;vertical-align:3px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:10px 16px;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid var(--botao-borda);background:var(--botao-fundo);color:var(--botao-texto);white-space:nowrap}
.botao:hover{filter:brightness(0.96)}
.botao.sec{background:var(--botao2-fundo);border-color:var(--botao2-borda);color:var(--botao2-texto)}
.botao.leve{background:transparent;border-color:var(--linha);color:var(--tinta)}
.botao[disabled]{opacity:.55;cursor:default}
.vazio{color:var(--suave);padding:24px;border:1.5px dashed var(--linha);border-radius:10px;text-align:center}

.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.painel h2{font:700 26px/1.1 var(--f-titulo);color:var(--tinta-forte)}
.painel .nota{color:var(--suave);font-size:15px}
.qr-bloco{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.qr{background:#FFFFFF;padding:10px;border-radius:8px;line-height:0;width:max-content}
.qr img,.qr canvas{display:block}
.qr-texto{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.qr-texto code{font:500 13px/1.4 var(--f-mono);word-break:break-all;color:var(--suave)}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap}
.rodape{display:flex;justify-content:center}
.link-discreto{background:none;border:0;color:var(--suave);text-decoration:underline;cursor:pointer;font-size:15px}

.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo span{font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.campo input,.campo textarea{border:1.5px solid var(--linha);background:var(--papel);border-radius:8px;padding:9px 12px;width:100%;box-sizing:border-box}
.campo input:focus,.campo textarea:focus{border-color:var(--cobre);outline:none}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cartao-aula{border:1px solid var(--linha);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--superficie)}
.cartao-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{border:1px solid var(--linha);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.mini.perigo{color:var(--alerta);border-color:currentColor}
.barra-salvar{position:sticky;bottom:0;z-index:5;background:var(--papel);border-top:2px solid var(--tinta);padding:14px 0 calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso{font-size:15px;color:var(--suave)}
.aviso.ok{color:var(--ok)}
.aviso.erro{color:var(--alerta)}

.projecao{position:fixed;inset:0;z-index:20;background:#FFFFFF;color:#16232C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));text-align:center}
.projecao h2{font:700 clamp(32px,6vw,64px)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.projecao p{font-size:20px;color:#55636C}
.projecao .fechar{position:absolute;top:calc(16px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));background:#16232C;color:#FFFFFF;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}

@media (max-width:640px){
  .aula{grid-template-columns:1fr;gap:6px}
  .acoes{justify-content:flex-start}
  .grade{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: no-preference){.chip,.botao{transition:background .15s,border-color .15s,filter .15s}}

</style>
</head>
<body>
<main id="raiz"></main>

<script>
/* =====================================================================
   LISTA DE TURMAS E AULAS
   Para acrescentar uma aula: envie o PDF para o repositório (junto
   com este index.html), copie um bloco { titulo: ..., pdf: "" }, cole logo abaixo
   do último da turma (separado por vírgula) e troque os textos.
   "link" = o arquivo da aula (ex.: "nome-do-arquivo.pdf") ou um
   endereço da internet. "pdf" é opcional (outro material para baixar).
   O "id" da turma vira o final do link e do QR code: use só letras
   minúsculas, números e hífen.
   ===================================================================== */
var DADOS = {
  professora: "Camila",
  apresentacao: "Slides e materiais das aulas, separados por turma. Escolha a sua turma e abra a aula do dia.",
  turmas: [
    {
      id: "automacao-b",
      nome: "Automação B",
      curso: "Técnico em Automação Industrial",
      unidade: "Fundamentos de Eletroeletrônica",
      aulas: [
        { titulo: "Cargas elétricas e eletrização", descricao: "Átomo, carga elétrica e eletrização por atrito, contato e indução", data: "", link: "cargas-eletricas.pdf", pdf: "" },
        { titulo: "Resistores", descricao: "Lei de Ohm, código de cores, associação de resistores e potência", data: "", link: "resistores.pdf", pdf: "" },
        { titulo: "Capacitores", descricao: "Capacitância, associação, reatância capacitiva e defasagem", data: "", link: "capacitores.pdf", pdf: "" },
        { titulo: "Indutores", descricao: "Indutância, associação, reatância indutiva e o CIVIL", data: "", link: "indutores.pdf", pdf: "" },
        { titulo: "Circuito RLC", descricao: "Tensões defasadas, Pitágoras, impedância e ressonância", data: "", link: "circuito-rlc.pdf", pdf: "" },
        { titulo: "Revisão e atividade avaliativa", descricao: "Do resistor ao circuito RLC série, com questões e gabarito", data: "", link: "revisao.pdf", pdf: "" }
      ]
    },
    {
      id: "turma-l",
      nome: "Turma L",
      curso: "Aprendizagem · Operador de Manutenção em Eletromecânica",
      unidade: "Módulo II",
      aulas: []
    },
    {
      id: "ead-eletromecanica",
      nome: "EAD Eletromecânica",
      curso: "Técnico em Eletromecânica (EAD)",
      unidade: "Metodologia de Projetos",
      aulas: []
    },
    {
      id: "ead-eletrotecnica",
      nome: "EAD Eletrotécnica",
      curso: "Técnico em Eletrotécnica (EAD)",
      unidade: "UC4 · Instalação e Manutenção Elétrica Predial",
      aulas: []
    }
  ]
};
/* ===================== FIM DA LISTA — não precisa mexer abaixo ===================== */
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var raiz = document.getElementById("raiz");
  var estado = { turma: null, projetar: false, aviso: "", avisoTipo: "" };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function seguro(u){ u = String(u || "").trim(); if (/^https?:\/\//i.test(u)) return u; return /^[A-Za-z0-9][A-Za-z0-9._\/-]*$/.test(u) && u.indexOf("..") < 0 ? u : ""; }
  function ehArquivo(u){ return !/^https?:\/\//i.test(u); }
  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function lerLocal(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function gravarLocal(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  function turmaAtual(){ for (var i=0;i<DADOS.turmas.length;i++) if (DADOS.turmas[i].id === estado.turma) return DADOS.turmas[i]; return null; }
  function linkTurma(t){ return location.href.replace(/#.*$/, "") + "#" + t.id; }

  function escolher(){
    var ids = DADOS.turmas.map(function(t){ return t.id; });
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (ids.indexOf(h) >= 0) return h;
    var l = lerLocal("turma");
    if (l && ids.indexOf(l) >= 0) return l;
    return ids[0] || null;
  }

  function render(){
    var t = turmaAtual();
    var h = '<header class="topo"><p class="rotulo">Instrutora · Elétrica e automação</p><h1>Profa. ' + esc(DADOS.professora) + '</h1>' +
      (DADOS.apresentacao ? '<p class="intro">' + esc(DADOS.apresentacao) + '</p>' : '') + '</header>';
    h += '<nav class="turmas" aria-label="Turmas">';
    DADOS.turmas.forEach(function(x){
      var at = t && x.id === t.id;
      h += '<a class="chip' + (at ? ' ativo' : '') + '" href="#' + esc(x.id) + '"' + (at ? ' aria-current="page"' : '') + '>' + esc(x.nome) + '</a>';
    });
    h += '</nav>';
    if (!t) { h += '<p class="vazio">Nenhuma turma cadastrada ainda.</p>'; }
    else {
      h += '<section class="turma" aria-labelledby="titulo-turma"><div class="turma-cab">' +
        (t.curso ? '<p class="rotulo">' + esc(t.curso) + '</p>' : '') +
        '<h2 id="titulo-turma">' + esc(t.nome) + '</h2>' +
        (t.unidade ? '<p class="uc">' + esc(t.unidade) + '</p>' : '') + '</div>';
      if (!t.aulas || !t.aulas.length) h += '<p class="vazio">As aulas desta turma vão aparecer aqui.</p>';
      else {
        h += '<ol class="aulas">';
        t.aulas.forEach(function(a, i){
          var link = seguro(a.link), pdf = seguro(a.pdf), ultima = i === t.aulas.length - 1;
          h += '<li class="aula"><span class="num">Aula ' + pad(i + 1) + '</span><div class="aula-texto"><h3>' + esc(a.titulo) +
            (ultima ? '<span class="novidade">Mais recente</span>' : '') + '</h3>' +
            (a.descricao ? '<p>' + esc(a.descricao) + '</p>' : '') + (a.data ? '<p class="data">' + esc(a.data) + '</p>' : '') +
            '</div><div class="acoes">' +
            (link ? '<a class="botao" href="' + esc(link) + '" target="_blank" rel="noopener">Abrir aula</a>' : '') +
            (link && ehArquivo(link) ? '<a class="botao sec" href="' + esc(link) + '" download>Baixar</a>' : '') +
            (pdf ? '<a class="botao sec" href="' + esc(pdf) + '" target="_blank" rel="noopener">Baixar material</a>' : '') +
            '</div></li>';
        });
        h += '</ol>';
      }
      h += '</section>';
      h += '<div class="rodape"><button type="button" class="link-discreto" data-acao="projetar">Mostrar QR code desta turma</button></div>';
      if (estado.projetar) {
        h += '<div class="projecao" role="dialog" aria-modal="true" aria-label="QR code da turma"><button type="button" class="fechar" data-acao="fechar">Fechar</button>' +
          '<h2>' + esc(t.nome) + '</h2><div class="qr" id="qr"></div><p>Aponte a câmera do celular para abrir as aulas da turma</p>' +
          '<p style="font-size:15px;word-break:break-all">' + esc(linkTurma(t)) + '</p>' +
          '<button type="button" class="botao leve" data-acao="copiar" style="color:#16232C;border-color:#C9D0CC">Copiar link</button>' +
          (estado.aviso ? '<p role="status" style="font-size:15px">' + esc(estado.aviso) + '</p>' : '') + '</div>';
      }
    }
    raiz.innerHTML = h;
    var qr = document.getElementById("qr");
    if (qr && t) {
      var px = Math.max(200, Math.min(window.innerWidth, window.innerHeight) * 0.5 | 0);
      if (typeof window.QRCode === "function") {
        try { new window.QRCode(qr, { text: linkTurma(t), width: px, height: px, colorDark: "#16232C", colorLight: "#FFFFFF", correctLevel: window.QRCode.CorrectLevel.M }); }
        catch(e){ qr.textContent = "Não foi possível gerar o QR code."; }
      } else { qr.style.lineHeight = "1.4"; qr.textContent = "QR code indisponível agora. Use o link abaixo."; }
    }
    document.title = (t ? t.nome + " · " : "") + "Aulas da Profa. " + DADOS.professora;
  }

  function aoMudarHash(){ estado.turma = escolher(); estado.projetar = false; gravarLocal("turma", estado.turma); render(); }
  window.addEventListener("hashchange", aoMudarHash);
  raiz.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("[data-acao]");
    if (!b) return;
    var acao = b.getAttribute("data-acao"), t = turmaAtual();
    if (acao === "projetar") { estado.projetar = true; estado.aviso = ""; }
    else if (acao === "fechar") estado.projetar = false;
    else if (acao === "copiar" && t) {
      var lk = linkTurma(t);
      try { navigator.clipboard.writeText(lk).then(function(){ estado.aviso = "Link copiado."; render(); }, function(){ estado.aviso = "Selecione o link acima e copie."; render(); }); } catch(er){ estado.aviso = "Selecione o link acima e copie."; }
    }
    render();
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && estado.projetar) { estado.projetar = false; render(); } });
  estado.turma = escolher();
  render();
})();
</script>
</body>
</html>
