<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aulas da Profa. Camila</title>
<meta name="description" content="Slides e materiais das aulas da Profa. Camila, separados por turma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: uma coluna estreita; cabeçalho com o nome, seletor de turmas, lista numerada de aulas, área da professora no fim */
:root{
  --papel:#F7F4EF; --superficie:#FFFFFF; --tinta:#2F3A45; --suave:#64707B; --linha:#E4DED5;
  --cobre:#9A5A36; --cobre-fundo:#F7E2D3; --tinta-forte:#26313B; --sobre-cobre:#FFFFFF;
  --ok:#3F6B4F; --alerta:#9A3B1C;
  --botao-fundo:#F6D9C6; --botao-texto:#5A3422; --botao-borda:#EBC2A7;
  --botao2-fundo:#E2ECF7; --botao2-texto:#24405F; --botao2-borda:#BCD2EA;
  --chip-fundo:#FFFFFF; --chip-texto:#2F3A45; --chip-borda:#E4DED5;
  --chip-ativo-fundo:#D4E5F5; --chip-ativo-texto:#1E3A5A; --chip-ativo-borda:#9FC0E2;
  --tag-fundo:#E1EEDB; --tag-texto:#3D5F2E;
  --f-titulo:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-texto:"Barlow",Arial,Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#22272C; --superficie:#2B3137; --tinta:#E8E5E0; --suave:#B4BAC0; --linha:#3D444B;
  --cobre:#E8B595; --cobre-fundo:#4A382D; --tinta-forte:#F3F0EB; --sobre-cobre:#2A1A10;
  --ok:#9CCFAE; --alerta:#F0A982;
  --botao-fundo:#5C4535; --botao-texto:#F8E6D9; --botao-borda:#76594A;
  --botao2-fundo:#344A61; --botao2-texto:#E3EEF9; --botao2-borda:#4B6684;
  --chip-fundo:#2B3137; --chip-texto:#E8E5E0; --chip-borda:#3D444B;
  --chip-ativo-fundo:#3E5875; --chip-ativo-texto:#EAF2FB; --chip-ativo-borda:#5C7C9E;
  --tag-fundo:#36492F; --tag-texto:#D3EBC6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#22272C; --superficie:#2B3137; --tinta:#E8E5E0; --suave:#B4BAC0; --linha:#3D444B;
  --cobre:#E8B595; --cobre-fundo:#4A382D; --tinta-forte:#F3F0EB; --sobre-cobre:#2A1A10;
  --ok:#9CCFAE; --alerta:#F0A982;
  --botao-fundo:#5C4535; --botao-texto:#F8E6D9; --botao-borda:#76594A;
  --botao2-fundo:#344A61; --botao2-texto:#E3EEF9; --botao2-borda:#4B6684;
  --chip-fundo:#2B3137; --chip-texto:#E8E5E0; --chip-borda:#3D444B;
  --chip-ativo-fundo:#3E5875; --chip-ativo-texto:#EAF2FB; --chip-ativo-borda:#5C7C9E;
  --tag-fundo:#36492F; --tag-texto:#D3EBC6; color-scheme:dark;
}
body{background:var(--papel);color:var(--tinta);font:17px/1.55 var(--f-texto);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#raiz{max-width:860px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--cobre)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobre);outline-offset:2px;border-radius:6px}

.topo{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--linha);padding-bottom:24px}
.rotulo{font:500 13px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cobre)}
.topo h1{font:700 clamp(40px,8vw,64px)/1 var(--f-titulo);color:var(--tinta-forte);letter-spacing:.005em}
.topo .intro{color:var(--suave);max-width:60ch}

.turmas{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;border:1.5px solid var(--chip-borda);background:var(--chip-fundo);color:var(--chip-texto);text-decoration:none;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--chip-ativo-borda);background:var(--botao2-fundo)}
.chip.ativo{background:var(--chip-ativo-fundo);border-color:var(--chip-ativo-borda);color:var(--chip-ativo-texto);font-weight:600}
.chip.novo{border-style:dashed;color:var(--cobre)}

.turma{display:flex;flex-direction:column;gap:20px}
.turma-cab{display:flex;flex-direction:column;gap:4px}
.turma-cab h2{font:700 36px/1.05 var(--f-titulo);color:var(--tinta-forte)}
.turma-cab .uc{color:var(--suave)}

.aulas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--linha)}
.aula{display:grid;grid-template-columns:96px 1fr auto;gap:8px 20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--linha)}
.num{font:500 13px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.aula-texto{min-width:0;display:flex;flex-direction:column;gap:2px}
.aula-texto h3{font:600 20px/1.25 var(--f-texto)}
.aula-texto p{color:var(--suave);font-size:16px}
.aula-texto .data{font:500 13px/1.3 var(--f-mono);color:var(--suave)}
.novidade{display:inline-block;margin-left:8px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tag-texto);background:var(--tag-fundo);padding:4px 7px;border-radius:4px;vertical-align:3px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:10px 16px;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid var(--botao-borda);background:var(--botao-fundo);color:var(--botao-texto);white-space:nowrap}
.botao:hover{filter:brightness(0.96)}
.botao.sec{background:var(--botao2-fundo);border-color:var(--botao2-borda);color:var(--botao2-texto)}
.botao.leve{background:transparent;border-color:var(--linha);color:var(--tinta)}
.botao[disabled]{opacity:.55;cursor:default}
.vazio{color:var(--suave);padding:24px;border:1.5px dashed var(--linha);border-radius:10px;text-align:center}

.painel{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.painel h2{font:700 26px/1.1 var(--f-titulo);color:var(--tinta-forte)}
.painel .nota{color:var(--suave);font-size:15px}
.qr-bloco{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.qr{background:#FFFFFF;padding:10px;border-radius:8px;line-height:0;width:max-content}
.qr img,.qr canvas{display:block}
.qr-texto{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.qr-texto code{font:500 13px/1.4 var(--f-mono);word-break:break-all;color:var(--suave)}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap}
.rodape{display:flex;justify-content:center}
.link-discreto{background:none;border:0;color:var(--suave);text-decoration:underline;cursor:pointer;font-size:15px}

.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo span{font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.campo input,.campo textarea{border:1.5px solid var(--linha);background:var(--papel);border-radius:8px;padding:9px 12px;width:100%;box-sizing:border-box}
.campo input:focus,.campo textarea:focus{border-color:var(--cobre);outline:none}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cartao-aula{border:1px solid var(--linha);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--superficie)}
.cartao-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{border:1px solid var(--linha);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.mini.perigo{color:var(--alerta);border-color:currentColor}
.barra-salvar{position:sticky;bottom:0;z-index:5;background:var(--papel);border-top:2px solid var(--tinta);padding:14px 0 calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso{font-size:15px;color:var(--suave)}
.aviso.ok{color:var(--ok)}
.aviso.erro{color:var(--alerta)}

.projecao{position:fixed;inset:0;z-index:20;background:#FFFFFF;color:#16232C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));text-align:center}
.projecao h2{font:700 clamp(32px,6vw,64px)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif}
.projecao p{font-size:20px;color:#55636C}
.projecao .fechar{position:absolute;top:calc(16px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));background:#16232C;color:#FFFFFF;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}

/* ---- Desafios ---- */
.secao-cab{display:flex;flex-direction:column;gap:4px}
.secao-cab h2{font:700 30px/1.05 var(--f-titulo);color:var(--tinta-forte)}
.secao-cab p{color:var(--suave)}
.desafios{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cartao-desafio{display:flex;flex-direction:column;gap:8px;height:100%;box-sizing:border-box;padding:18px;border:1.5px solid var(--linha);border-radius:12px;background:var(--superficie);text-decoration:none;color:var(--tinta)}
.cartao-desafio:hover{border-color:var(--cobre)}
.cartao-desafio .chamada{font:600 19px/1.25 var(--f-texto);color:var(--tinta-forte)}
.cartao-desafio .det{color:var(--suave);font-size:15px;flex:1}
.cartao-desafio .rodape-c{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 13px/1.3 var(--f-mono);color:var(--suave)}
.selo{font:500 12px/1 var(--f-mono);padding:5px 8px;border-radius:4px;background:var(--tag-fundo);color:var(--tag-texto);white-space:nowrap}
.selo.baixo{background:var(--cobre-fundo);color:var(--botao-texto)}

.voltar{align-self:flex-start;background:none;border:0;padding:0;color:var(--cobre);font-weight:600;cursor:pointer;text-decoration:none}
.questoes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.questao{border:1px solid var(--linha);border-radius:12px;background:var(--superficie);padding:20px;display:flex;flex-direction:column;gap:14px}
.questao.certa{border-color:var(--ok);border-width:2px}
.questao.errada{border-color:var(--alerta);border-width:2px}
.q-cab{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.q-num{font:500 13px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.q-fonte{font:500 12px/1 var(--f-mono);color:var(--botao2-texto);background:var(--botao2-fundo);padding:5px 8px;border-radius:4px}
.enunciado{font-size:17px}
.alts{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.alt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1.5px solid var(--linha);border-radius:10px;cursor:pointer;background:var(--papel)}
.alt:hover{border-color:var(--chip-ativo-borda)}
.alt input{position:absolute;opacity:0;pointer-events:none}
.alt .letra{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linha);font:600 14px/1 var(--f-mono);box-sizing:border-box}
.alt.marcada{border-color:var(--chip-ativo-borda);background:var(--chip-ativo-fundo);color:var(--chip-ativo-texto)}
.alt.marcada .letra{background:var(--chip-ativo-texto);border-color:var(--chip-ativo-texto);color:var(--chip-ativo-fundo)}
.alt:has(input:focus-visible){outline:3px solid var(--cobre);outline-offset:2px}
.alt.fixa{cursor:default}
.alt.e-certa{border-color:var(--ok);background:var(--tag-fundo);color:var(--tag-texto)}
.alt.e-certa .letra{background:var(--ok);border-color:var(--ok);color:var(--superficie)}
.alt.e-errada{border-color:var(--alerta);background:var(--cobre-fundo);color:var(--botao-texto)}
.alt.e-errada .letra{background:var(--alerta);border-color:var(--alerta);color:var(--superficie)}
.alt .marca{font:500 12px/1.3 var(--f-mono);display:block;margin-top:2px}
.veredito{font-weight:600}
.veredito.ok{color:var(--ok)}
.veredito.erro{color:var(--alerta)}
.justificativa{border-left:3px solid var(--cobre);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.justificativa strong{font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cobre)}
.placar{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:24px}
.placar .pct{font:700 clamp(56px,14vw,88px)/1 var(--f-titulo);color:var(--tinta-forte)}
.placar .pct.bom{color:var(--ok)}
.placar .pct.baixo{color:var(--alerta)}
.placar-texto{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.placar-texto .msg{font:600 20px/1.3 var(--f-texto)}
.barra{height:10px;border-radius:999px;background:var(--linha);overflow:hidden}
.barra span{display:block;height:100%;background:var(--ok)}
.filtro{display:flex;gap:8px;flex-wrap:wrap}
.envio{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--papel);border-top:2px solid var(--linha);padding:14px 0 calc(14px + env(safe-area-inset-bottom, 0px))}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.95em;line-height:1.2;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.rz{white-space:nowrap}
.rz>span{border-top:1.5px solid currentColor;padding:0 2px}
sup,sub{line-height:0}

@media (max-width:640px){
  .aula{grid-template-columns:1fr;gap:6px}
  .questao{padding:16px}
  .acoes{justify-content:flex-start}
  .grade{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: no-preference){.chip,.botao{transition:background .15s,border-color .15s,filter .15s}}

</style>
</head>
<body>
<main id="raiz"></main>

<script>
/* =====================================================================
   LISTA DE TURMAS E AULAS
   Para acrescentar uma aula: envie o PDF para o repositório (junto
   com este index.html), copie um bloco { titulo: ..., pdf: "" }, cole logo abaixo
   do último da turma (separado por vírgula) e troque os textos.
   "link" = o arquivo da aula (ex.: "nome-do-arquivo.pdf") ou um
   endereço da internet. "pdf" é opcional (outro material para baixar).
   O "id" da turma vira o final do link e do QR code: use só letras
   minúsculas, números e hífen.
   ===================================================================== */
var DADOS = {
  professora: "Camila",
  apresentacao: "Slides, materiais e desafios das aulas. Abra a aula do dia ou teste seus conhecimentos nos desafios.",
  turmas: [
    {
      id: "automacao-b",
      nome: "Automação B",
      curso: "Técnico em Automação Industrial",
      unidade: "Fundamentos de Eletroeletrônica",
      aulas: [
        { titulo: "Cargas elétricas e eletrização", descricao: "Átomo, carga elétrica e eletrização por atrito, contato e indução", data: "", link: "cargas-eletricas.pdf", pdf: "" },
        { titulo: "Resistores", descricao: "Lei de Ohm, código de cores, associação de resistores e potência", data: "", link: "resistores.pdf", pdf: "" },
        { titulo: "Capacitores", descricao: "Capacitância, associação, reatância capacitiva e defasagem", data: "", link: "capacitores.pdf", pdf: "" },
        { titulo: "Indutores", descricao: "Indutância, associação, reatância indutiva e o CIVIL", data: "", link: "indutores.pdf", pdf: "" },
        { titulo: "Circuito RLC", descricao: "Tensões defasadas, Pitágoras, impedância e ressonância", data: "", link: "circuito-rlc.pdf", pdf: "" },
        { titulo: "Revisão e atividade avaliativa", descricao: "Do resistor ao circuito RLC série, com questões e gabarito", data: "", link: "revisao.pdf", pdf: "" }
      ]
    }
  ],
  /* TURMAS GUARDADAS — não aparecem no site. Para voltar a mostrar uma turma,
     recorte o bloco { id: ... } dela daqui e cole dentro de "turmas", acima. */
  turmasGuardadas: [
    {
      id: "turma-l",
      nome: "Turma L",
      curso: "Aprendizagem · Operador de Manutenção em Eletromecânica",
      unidade: "Módulo II",
      aulas: []
    },
    {
      id: "ead-eletromecanica",
      nome: "EAD Eletromecânica",
      curso: "Técnico em Eletromecânica (EAD)",
      unidade: "Metodologia de Projetos",
      aulas: []
    },
    {
      id: "ead-eletrotecnica",
      nome: "EAD Eletrotécnica",
      curso: "Técnico em Eletrotécnica (EAD)",
      unidade: "UC4 · Instalação e Manutenção Elétrica Predial",
      aulas: []
    }
  ]
};

/* =====================================================================
   DESAFIOS (questionários) — separados pelo "id" da turma
   Cada desafio tem: id (vira o final do link), tema, descrição e as questões.
   Cada questão tem: fonte, enunciado, alternativas (A, B, C...), correta
   (a letra) e justificativa.
   Escrita especial nos textos:
     {{numerador|denominador}}  → fração empilhada
     10^{−6}                    → expoente (sobrescrito)
     X_{C}                      → índice (subscrito)
     √{R^{2} + X^{2}}           → raiz quadrada
   ===================================================================== */
var DESAFIOS = {
  "automacao-b": [
    {
      id: "cargas-eletricas",
      tema: "cargas elétricas e eletrização",
      descricao: "Atrito, contato, indução e quantidade de carga",
      questoes: [
        {
          fonte: "Estilo ENEM",
          enunciado: "Num dia seco, um estudante penteia o cabelo com um pente de plástico e, em seguida, aproxima o pente de pedacinhos de papel picado, que são atraídos por ele. Esse fenômeno acontece porque",
          alternativas: [
            "o pente ficou magnetizado pelo atrito e atrai o papel como um ímã.",
            "o pente foi eletrizado por atrito e, ao se aproximar, provoca uma separação de cargas no papel neutro, que acaba atraído.",
            "o papel já estava carregado com carga de sinal oposto ao do pente antes da aproximação.",
            "o cabelo transferiu prótons para o pente, que passou a atrair os elétrons do papel.",
            "o atrito aqueceu o pente, e o ar quente arrasta o papel em direção a ele."
          ],
          correta: "B",
          justificativa: "O atrito transfere elétrons entre o cabelo e o pente, que fica eletrizado. O papel continua neutro, mas, com o pente perto, suas cargas se reorganizam (polarização por indução): as cargas de sinal oposto ao do pente ficam mais perto dele e são atraídas com mais força do que as de mesmo sinal são repelidas. Não é magnetismo (A), o papel não estava carregado (C) e prótons não passam de um corpo para outro — quem se move são os elétrons (D)."
        },
        {
          fonte: "Estilo concurso",
          enunciado: "Dois corpos inicialmente neutros, um de lã e outro de vidro, são atritados entre si e depois separados. Considerando que nenhuma carga escapa para o ambiente, é correto afirmar que os corpos ficam:",
          alternativas: [
            "ambos com carga positiva.",
            "ambos com carga negativa.",
            "com cargas de sinais opostos e de mesmo valor.",
            "com cargas de sinais opostos e de valores diferentes.",
            "um carregado e o outro neutro."
          ],
          correta: "C",
          justificativa: "No atrito, elétrons passam de um corpo para o outro. Quem perde elétrons fica positivo e quem ganha fica negativo, na mesma quantidade, porque a carga total se conserva: antes era zero e continua zero depois (+Q + (−Q) = 0)."
        },

            "a impedância é a soma R + X_{L} + X_{C}."
          ],
          correta: "A",
          justificativa: "Na ressonância, X_{L} = X_{C}, então X_{L} − X_{C} = 0 e Z = √{R^{2} + 0} = R. Como Z fica no menor valor possível, a corrente I = {{V|R}} é a maior possível."
        },
        {
          fonte: "Estilo concurso",
          enunciado: "Num circuito RLC série, X_{L} = 80 Ω e X_{C} = 30 Ω. O circuito tem comportamento:",
          alternativas: [
            "resistivo, com corrente em fase com a tensão.",
            "indutivo, com a corrente atrasada em relação à tensão.",
            "capacitivo, com a corrente adiantada em relação à tensão.",
            "indutivo, com a corrente adiantada em relação à tensão.",
            "capacitivo, com a corrente atrasada em relação à tensão."
          ],
          correta: "B",
          justificativa: "Como X_{L} > X_{C}, sobra reatância indutiva (80 − 30 = 50 Ω) e o circuito se comporta como indutivo. Pelo CIVIL, no indutor a tensão vem antes, então a corrente fica atrasada em relação à tensão."
        },
        {
          fonte: "Estilo vestibular",
          enunciado: "Um circuito RLC série tem L = 10 mH e C = 10 μF. Sua frequência de ressonância é, aproximadamente:",
          alternativas: ["60 Hz", "159 Hz", "503 Hz", "1 000 Hz", "5 030 Hz"],
          correta: "C",
          justificativa: "f_{0} = {{1|2 · π · √{L · C}}}. 1) L · C = 0,01 × 10 × 10^{−6} = 10^{−7}. 2) √{10^{−7}} ≈ 3,16 × 10^{−4}. 3) 2 × 3,14 × 3,16 × 10^{−4} ≈ 1,99 × 10^{−3}. 4) f_{0} = {{1|1,99 × 10^{−3}}} ≈ 503 Hz."
        },
        {
          fonte: "Estilo concurso",
          enunciado: "Um circuito RLC série com R = 10 Ω é ligado a 20 V, na frequência de ressonância. A corrente no circuito é:",
          alternativas: ["0,5 A", "1 A", "2 A", "20 A", "200 A"],
          correta: "C",
          justificativa: "Na ressonância, X_{L} = X_{C} e a impedância fica igual a R: Z = 10 Ω. Então I = {{V|Z}} = {{20|10}} = 2 A, que é a maior corrente que esse circuito consegue ter."
        }
      ]
    }
  ]
};
/* ===================== FIM DA LISTA — não precisa mexer abaixo ===================== */
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var raiz = document.getElementById("raiz");
  var estado = { turma: null, desafio: null, respostas: {}, ordem: {}, corrigido: false, filtro: "erradas", faltando: false, projetar: false, aviso: "" };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  /* texto com frações, expoentes, índices e raiz */
  function fmt(s){
    var h = esc(s);
    h = h.replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>");
    h = h.replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>");
    h = h.replace(/√\{([^{}]*)\}/g, '<span class="rz">√<span>$1</span></span>');
    var antes;
    do { antes = h; h = h.replace(/\{\{([^{}|]*)\|([^{}]*)\}\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>'); } while (h !== antes);
    return h;
  }
  function seguro(u){ u = String(u || "").trim(); if (/^https?:\/\//i.test(u)) return u; return /^[A-Za-z0-9][A-Za-z0-9._\/-]*$/.test(u) && u.indexOf("..") < 0 ? u : ""; }
  function ehArquivo(u){ return !/^https?:\/\//i.test(u); }
  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function lerLocal(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function gravarLocal(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  var LETRAS = "ABCDEFGH";
  function turmaAtual(){ for (var i=0;i<DADOS.turmas.length;i++) if (DADOS.turmas[i].id === estado.turma) return DADOS.turmas[i]; return null; }
  function desafiosDa(t){ return (t && typeof DESAFIOS !== "undefined" && DESAFIOS[t.id]) || []; }
  function desafioAtual(){ var t = turmaAtual(), l = desafiosDa(t); for (var i=0;i<l.length;i++) if (l[i].id === estado.desafio) return l[i]; return null; }
  function linkTurma(t){ return location.href.replace(/#.*$/, "") + "#" + t.id; }
  function chaveResultado(t, d){ return "resultado:" + t.id + ":" + d.id; }
  function idxCorreta(q){ return LETRAS.indexOf(String(q.correta || "").trim().toUpperCase()); }
  /* embaralha a ordem das alternativas a cada tentativa (a letra "correta" do arquivo continua valendo) */
  function embaralhar(d){
    estado.ordem = {};
    (d ? d.questoes : []).forEach(function(q, i){
      var o = (q.alternativas || []).map(function(_, j){ return j; });
      for (var k = o.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), x = o[k]; o[k] = o[r]; o[r] = x; }
      estado.ordem[i] = o;
    });
  }
  function ordemDe(i, q){ return estado.ordem[i] || (q.alternativas || []).map(function(_, j){ return j; }); }
  function letraDe(i, q, j){ var p = ordemDe(i, q).indexOf(j); return p < 0 ? "?" : LETRAS.charAt(p); }
  function remapear(txt, i, q){
    return String(txt || "").replace(/alternativa ([A-H])\b/g, function(_, L){ return "alternativa " + letraDe(i, q, LETRAS.indexOf(L)); })
      .replace(/\(([A-H])\)/g, function(_, L){ return "(" + letraDe(i, q, LETRAS.indexOf(L)) + ")"; });
  }

  function lerHash(){
    var partes = decodeURIComponent((location.hash || "").slice(1)).split("/");
    var ids = DADOS.turmas.map(function(t){ return t.id; });
    var turma = ids.indexOf(partes[0]) >= 0 ? partes[0] : null;
    if (!turma) { var l = lerLocal("turma"); turma = l && ids.indexOf(l) >= 0 ? l : (ids[0] || null); }
    estado.turma = turma;
    estado.desafio = (partes[1] === "desafio" && partes[2]) ? partes[2] : null;
    if (estado.desafio && !desafioAtual()) estado.desafio = null;
  }

  function cabecalho(compacto){
    var h = '<header class="topo"><p class="rotulo">Instrutora · Elétrica e automação</p><h1>Profa. ' + esc(DADOS.professora) + '</h1>' +
      (!compacto && DADOS.apresentacao ? '<p class="intro">' + esc(DADOS.apresentacao) + '</p>' : '') + '</header>';
    if (DADOS.turmas.length > 1 && !compacto) {
      h += '<nav class="turmas" aria-label="Turmas">';
      DADOS.turmas.forEach(function(x){
        var at = x.id === estado.turma;
        h += '<a class="chip' + (at ? ' ativo' : '') + '" href="#' + esc(x.id) + '"' + (at ? ' aria-current="page"' : '') + '>' + esc(x.nome) + '</a>';
      });
      h += '</nav>';
    }
    return h;
  }

  function telaTurma(t){
    var h = '<section class="turma" aria-labelledby="titulo-turma"><div class="turma-cab">' +
      (t.curso ? '<p class="rotulo">' + esc(t.curso) + '</p>' : '') +
      '<h2 id="titulo-turma">' + esc(t.nome) + '</h2>' +
      (t.unidade ? '<p class="uc">' + esc(t.unidade) + '</p>' : '') + '</div>';
    if (!t.aulas || !t.aulas.length) h += '<p class="vazio">As aulas desta turma vão aparecer aqui.</p>';
    else {
      h += '<ol class="aulas">';
      t.aulas.forEach(function(a, i){
        var link = seguro(a.link), pdf = seguro(a.pdf), ultima = i === t.aulas.length - 1;
        h += '<li class="aula"><span class="num">Aula ' + pad(i + 1) + '</span><div class="aula-texto"><h3>' + esc(a.titulo) +
          (ultima ? '<span class="novidade">Mais recente</span>' : '') + '</h3>' +
          (a.descricao ? '<p>' + esc(a.descricao) + '</p>' : '') + (a.data ? '<p class="data">' + esc(a.data) + '</p>' : '') +
          '</div><div class="acoes">' +
          (link ? '<a class="botao" href="' + esc(link) + '" target="_blank" rel="noopener">Abrir aula</a>' : '') +
          (link && ehArquivo(link) ? '<a class="botao sec" href="' + esc(link) + '" download>Baixar</a>' : '') +
          (pdf ? '<a class="botao sec" href="' + esc(pdf) + '" target="_blank" rel="noopener">Baixar material</a>' : '') +
          '</div></li>';
      });
      h += '</ol>';
    }
    h += '</section>';

    var ds = desafiosDa(t);
    if (ds.length) {
      h += '<section class="turma" aria-labelledby="titulo-desafios"><div class="secao-cab"><p class="rotulo">Desafios</p>' +
        '<h2 id="titulo-desafios">Teste seus conhecimentos</h2>' +
        '<p>Questões no estilo do ENEM, de vestibulares e de concursos. Responda tudo e veja na hora quanto acertou, a resposta certa e o porquê.</p></div><ul class="desafios">';
      ds.forEach(function(d){
        var r = lerLocal(chaveResultado(t, d)), n = (d.questoes || []).length;
        var selo = r !== null && r !== "" ? '<span class="selo' + (+r < 60 ? ' baixo' : '') + '">Último: ' + esc(r) + '%</span>' : '';
        h += '<li><a class="cartao-desafio" href="#' + esc(t.id) + '/desafio/' + esc(d.id) + '">' +
          '<span class="chamada">Teste seus conhecimentos sobre ' + esc(d.tema) + '</span>' +
          (d.descricao ? '<span class="det">' + esc(d.descricao) + '</span>' : '<span class="det"></span>') +
          '<span class="rodape-c"><span>' + n + (n === 1 ? ' questão' : ' questões') + '</span>' + selo + '</span></a></li>';
      });
      h += '</ul></section>';
    }

    h += '<div class="rodape"><button type="button" class="link-discreto" data-acao="projetar">Mostrar QR code desta turma</button></div>';
    if (estado.projetar) {
      h += '<div class="projecao" role="dialog" aria-modal="true" aria-label="QR code da turma"><button type="button" class="fechar" data-acao="fechar">Fechar</button>' +
        '<h2>' + esc(t.nome) + '</h2><div class="qr" id="qr"></div><p>Aponte a câmera do celular para abrir as aulas da turma</p>' +
        '<p style="font-size:15px;word-break:break-all">' + esc(linkTurma(t)) + '</p>' +
        '<button type="button" class="botao leve" data-acao="copiar" style="color:#16232C;border-color:#C9D0CC">Copiar link</button>' +
        (estado.aviso ? '<p role="status" style="font-size:15px">' + esc(estado.aviso) + '</p>' : '') + '</div>';
    }
    return h;
  }

  function contar(d){
    var acertos = 0, respondidas = 0;
    d.questoes.forEach(function(q, i){
      if (estado.respostas[i] != null) respondidas++;
      if (estado.respostas[i] === idxCorreta(q)) acertos++;
    });
    return { acertos: acertos, respondidas: respondidas, total: d.questoes.length };
  }

  function telaDesafio(t, d){
    var c = contar(d), h = '<a class="voltar" href="#' + esc(t.id) + '">← Voltar para ' + esc(t.nome) + '</a>';
    h += '<div class="secao-cab"><p class="rotulo">Desafio · ' + c.total + ' questões</p><h2 id="topo-desafio" tabindex="-1">Teste seus conhecimentos sobre ' + esc(d.tema) + '</h2>' +
      (d.descricao ? '<p>' + esc(d.descricao) + '</p>' : '') + '</div>';

    if (estado.corrigido) {
      var pct = Math.round(100 * c.acertos / (c.total || 1));
      var erros = c.total - c.acertos;
      var msg = pct === 100 ? "Gabaritou! Mandou muito bem." : pct >= 80 ? "Muito bom! Confira só o que faltou." : pct >= 60 ? "Bom caminho. Revise as que errou." : "Vale revisar a aula e tentar de novo.";
      h += '<div class="placar" role="status"><span class="pct ' + (pct >= 60 ? 'bom' : 'baixo') + '">' + pct + '%</span><div class="placar-texto">' +
        '<span class="msg">' + msg + '</span><span>' + c.acertos + ' de ' + c.total + ' certas' + (erros ? ' · ' + erros + (erros === 1 ? ' errada' : ' erradas') : '') + '</span>' +
        '<div class="barra" aria-hidden="true"><span style="width:' + pct + '%"></span></div></div></div>';
      h += '<div class="filtro" role="group" aria-label="Mostrar">' +
        '<button type="button" class="chip' + (estado.filtro === "erradas" ? ' ativo' : '') + '" data-acao="filtro" data-valor="erradas"' + (erros ? '' : ' disabled') + '>Só as que errei (' + erros + ')</button>' +
        '<button type="button" class="chip' + (estado.filtro === "todas" ? ' ativo' : '') + '" data-acao="filtro" data-valor="todas">Todas as questões</button></div>';
    }

    h += '<ol class="questoes">';
    d.questoes.forEach(function(q, i){
      var marcada = estado.respostas[i], certa = idxCorreta(q), acertou = marcada === certa;
      if (estado.corrigido && estado.filtro === "erradas" && acertou && c.acertos < c.total) return;
      var classe = estado.corrigido ? (acertou ? ' certa' : ' errada') : '';
      h += '<li class="questao' + classe + '" id="q' + i + '"><div class="q-cab"><span class="q-num">Questão ' + pad(i + 1) + '</span>' +
        (q.fonte ? '<span class="q-fonte">' + esc(q.fonte) + '</span>' : '') + '</div>' +
        '<p class="enunciado" id="enun' + i + '">' + fmt(q.enunciado) + '</p>' +
        '<fieldset class="alts" aria-labelledby="enun' + i + '">';
      ordemDe(i, q).forEach(function(j, pos){
        var a = q.alternativas[j], cl = 'alt';
        var marca = '';
        if (estado.corrigido) {
          cl += ' fixa';
          if (j === certa) { cl += ' e-certa'; marca = j === marcada ? 'Sua resposta · correta' : 'Resposta correta'; }
          else if (j === marcada) { cl += ' e-errada'; marca = 'Sua resposta'; }
        } else if (j === marcada) cl += ' marcada';
        h += '<label class="' + cl + '"><input type="radio" name="q' + i + '" value="' + j + '"' + (j === marcada ? ' checked' : '') + (estado.corrigido ? ' disabled' : '') + ' data-q="' + i + '">' +
          '<span class="letra">' + LETRAS.charAt(pos) + '</span><span>' + fmt(a) + (marca ? '<span class="marca">' + marca + '</span>' : '') + '</span></label>';
      });
      h += '</fieldset>';
      if (estado.corrigido) {
        h += '<p class="veredito ' + (acertou ? 'ok">Você acertou.' : 'erro">' + (marcada == null ? 'Sem resposta.' : 'Você marcou ' + letraDe(i, q, marcada) + '.') + ' A correta é a ' + letraDe(i, q, certa) + '.') + '</p>' +
          '<div class="justificativa"><strong>Por que a ' + letraDe(i, q, certa) + ' está certa</strong><p>' + fmt(remapear(q.justificativa, i, q)) + '</p></div>';
      }
      h += '</li>';
    });
    h += '</ol>';

    if (!estado.corrigido) {
      var falta = c.total - c.respondidas;
      h += '<div class="envio"><button type="button" class="botao" data-acao="corrigir">Ver meu resultado</button><span class="aviso' + (estado.faltando && falta ? ' erro' : '') + '" role="status">' +
        (falta ? (estado.faltando ? 'Ainda falta' + (falta === 1 ? ' 1 questão' : 'm ' + falta + ' questões') + ' para responder.' : c.respondidas + ' de ' + c.total + ' respondidas') : 'Tudo respondido!') + '</span></div>';
    } else {
      h += '<div class="linha-botoes"><button type="button" class="botao" data-acao="refazer">Refazer este desafio</button><a class="botao sec" href="#' + esc(t.id) + '">Outros desafios</a></div>';
    }
    return h;
  }

  function render(){
    var t = turmaAtual(), d = desafioAtual();
    var h = cabecalho(!!d);
    if (!t) h += '<p class="vazio">Nenhuma turma cadastrada ainda.</p>';
    else h += d ? telaDesafio(t, d) : telaTurma(t);
    raiz.innerHTML = h;
    var qr = document.getElementById("qr");
    if (qr && t) {
      var px = Math.max(200, Math.min(window.innerWidth, window.innerHeight) * 0.5 | 0);
      if (typeof window.QRCode === "function") {
        try { new window.QRCode(qr, { text: linkTurma(t), width: px, height: px, colorDark: "#16232C", colorLight: "#FFFFFF", correctLevel: window.QRCode.CorrectLevel.M }); }
        catch(e){ qr.textContent = "Não foi possível gerar o QR code."; }
      } else { qr.style.lineHeight = "1.4"; qr.textContent = "QR code indisponível agora. Use o link abaixo."; }
    }
    document.title = (d ? "Desafio: " + d.tema + " · " : t ? t.nome + " · " : "") + "Aulas da Profa. " + DADOS.professora;
  }

  function aoMudarHash(){
    var antes = estado.desafio;
    lerHash();
    if (estado.desafio !== antes) { estado.respostas = {}; estado.corrigido = false; estado.faltando = false; estado.filtro = "erradas"; embaralhar(desafioAtual()); }
    estado.projetar = false;
    gravarLocal("turma", estado.turma);
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", aoMudarHash);

  raiz.addEventListener("change", function(e){
    var el = e.target;
    if (el && el.type === "radio" && el.hasAttribute("data-q") && !estado.corrigido) {
      estado.respostas[+el.getAttribute("data-q")] = +el.value;
      var y = window.scrollY, nome = el.name;
      render();
      window.scrollTo(0, y);
      var de = raiz.querySelector('input[name="' + nome + '"]:checked'); if (de) try { de.focus({ preventScroll: true }); } catch(er){}
    }
  });

  raiz.addEventListener("click", function(e){
    var b = e.target.closest && e.target.closest("[data-acao]");
    if (!b) return;
    var acao = b.getAttribute("data-acao"), t = turmaAtual(), d = desafioAtual();
    if (acao === "projetar") { estado.projetar = true; estado.aviso = ""; }
    else if (acao === "fechar") estado.projetar = false;
    else if (acao === "copiar" && t) {
      var lk = linkTurma(t);
      try { navigator.clipboard.writeText(lk).then(function(){ estado.aviso = "Link copiado."; render(); }, function(){ estado.aviso = "Selecione o link acima e copie."; render(); }); } catch(er){ estado.aviso = "Selecione o link acima e copie."; }
    }
    else if (acao === "corrigir" && d) {
      var c = contar(d);
      if (c.respondidas < c.total) {
        estado.faltando = true;
        render();
        for (var i = 0; i < d.questoes.length; i++) if (estado.respostas[i] == null) { var q = document.getElementById("q" + i); if (q) q.scrollIntoView({ block: "start" }); break; }
        return;
      }
      estado.corrigido = true;
      estado.filtro = c.acertos < c.total ? "erradas" : "todas";
      gravarLocal(chaveResultado(t, d), String(Math.round(100 * c.acertos / (c.total || 1))));
      render();
      window.scrollTo(0, 0);
      var tp = document.getElementById("topo-desafio"); if (tp) try { tp.focus({ preventScroll: true }); } catch(er){}
      return;
    }
    else if (acao === "refazer") { estado.respostas = {}; estado.corrigido = false; estado.faltando = false; embaralhar(d); render(); window.scrollTo(0, 0); return; }
    else if (acao === "filtro") { estado.filtro = b.getAttribute("data-valor"); }
    else return;
    render();
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && estado.projetar) { estado.projetar = false; render(); } });
  lerHash();
  embaralhar(desafioAtual());
  render();
})();
</script>
